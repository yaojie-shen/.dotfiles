# Getting colors in tmux
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

set -g mouse on

# Enable more history
set -g history-limit 50000

# Set window and panel index to start at 1
set -g base-index 1
setw -g pane-base-index 1

# Enable activity monitoring to track window output
setw -g monitor-activity on
# Disable visual bell for activity
set -g visual-activity off

# Set pane selection indicator (prefix + q) to display for 5 seconds
set -g display-panes-time 5000

# Move between panes with Ctrl+b + h/j/k/l
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize using arrow keys with dynamic step
bind Left command-prompt -p "Resize left by (default 40):" \
    "run 'n=%1; [ -z \"\$n\" ] && n=40; tmux resize-pane -L \$n'"
bind Right command-prompt -p "Resize right by (default 40):" \
    "run 'n=%1; [ -z \"\$n\" ] && n=40; tmux resize-pane -R \$n'"
bind Up command-prompt -p "Resize up by (default 10):" \
    "run 'n=%1; [ -z \"\$n\" ] && n=10; tmux resize-pane -U \$n'"
bind Down command-prompt -p "Resize down by (default 10):" \
    "run 'n=%1; [ -z \"\$n\" ] && n=10; tmux resize-pane -D \$n'"

# Use Ctrl+Shift+Left/Right to move the current window to left/right.
# More info: https://superuser.com/questions/343572/how-do-i-reorder-tmux-windows
bind-key -n C-S-Left swap-window -t -1\; select-window -t -1
bind-key -n C-S-Right swap-window -t +1\; select-window -t +1

# Default is too slow which is annoying during heavy-use of the nvim in tmux.
set-option -s escape-time 0

# TPM plugins. Install/update with prefix + I, after adding new ones here.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.3.0'

# Self-bootstrap TPM + plugins on a fresh machine (no manual prefix+I).
# install_plugins needs TMUX_PLUGIN_MANAGER_PATH, normally only set by the
# final `run tpm/tpm` below - must set it manually here (tmux-plugins/tpm#105).
setenv -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"
if "test ! -f ~/.tmux/plugins/tmux/catppuccin.tmux" \
   "run 'test -d ~/.tmux/plugins/tpm || git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm; ~/.tmux/plugins/tpm/bin/install_plugins'"

# Install workmux automatically when tmux first starts on a new machine.
if "test ! -x ~/.local/bin/workmux" "run '~/.devbox/setup/workmux'"
bind-key f display-popup -E -w 90% -h 80% '"$HOME/.local/bin/workmux" dashboard'
bind-key F run-shell '"$HOME/.local/bin/workmux" sidebar'

# Catppuccin theme config (must be set before the plugin loads, below)
set -g @catppuccin_flavor "mocha"
set-environment -g COLORFGBG "15;0"
set -g @catppuccin_window_status_style "rounded"
# Shell panes show the dir name; programs show "command · <title>", with
# the title truncated to 15 chars + ellipsis (Claude Code titles are long).
set -g @dotfiles_home "$HOME"
set -g @catppuccin_window_text " #{?#{m/r:^(bash|zsh|fish|sh)$,#{pane_current_command}},#{?#{==:#{pane_current_path},#{@dotfiles_home}},~,#{b:pane_current_path}},#{pane_current_command} · #{=/15/…:pane_title}}"
set -g @catppuccin_window_current_text " #{?#{m/r:^(bash|zsh|fish|sh)$,#{pane_current_command}},#{?#{==:#{pane_current_path},#{@dotfiles_home}},~,#{b:pane_current_path}},#{pane_current_command} · #{=/15/…:pane_title}}"
set -g @catppuccin_date_time_text "%m-%d %H:%M"
# Use a real Catppuccin color so rounded window separators render correctly.
set -g @catppuccin_status_background "#{@thm_bg}"
# Keep the session module colors tied to the active flavor instead of the
# palette that happened to be loaded when the module was first generated.
set -g @catppuccin_status_session_icon_fg "#{@thm_crust}"
set -g @catppuccin_status_session_text_fg "#{@thm_fg}"
set -g @catppuccin_status_session_text_bg "#{@thm_surface_0}"
# Keep the selected window visibly distinct from non-current windows.
set -g @catppuccin_window_current_text_color "#{@thm_overlay_0}"

# Load before the custom status format so @thm_* colors are available.
run '~/.tmux/plugins/tmux/catppuccin.tmux'

# tmux 3.6+ reports terminal theme changes. Older versions keep the dark
# defaults above; they do not poll or inspect the host operating system.
%if "#{>=:#{version},3.6}"
set-hook -g client-dark-theme {
  set -g @catppuccin_flavor "mocha"
  set -g @catppuccin_reset "true"
  set-environment -g COLORFGBG "15;0"
  run '~/.tmux/plugins/tmux/catppuccin.tmux'
  set -g @catppuccin_window_status_style "rounded"
  set -g @catppuccin_window_text " #{?#{m/r:^(bash|zsh|fish|sh)$,#{pane_current_command}},#{?#{==:#{pane_current_path},#{@dotfiles_home}},~,#{b:pane_current_path}},#{pane_current_command} · #{=/15/…:pane_title}}"
  set -g @catppuccin_window_current_text " #{?#{m/r:^(bash|zsh|fish|sh)$,#{pane_current_command}},#{?#{==:#{pane_current_path},#{@dotfiles_home}},~,#{b:pane_current_path}},#{pane_current_command} · #{=/15/…:pane_title}}"
  set -g @catppuccin_status_background "#{@thm_bg}"
  set -g @catppuccin_status_session_icon_fg "#{@thm_crust}"
  set -g @catppuccin_status_session_text_fg "#{@thm_fg}"
  set -g @catppuccin_status_session_text_bg "#{@thm_surface_0}"
  set -g @catppuccin_window_current_text_color "#{@thm_overlay_0}"
  set -gu @catppuccin_window_current_left_separator
  set -gu @catppuccin_window_current_middle_separator
  set -gu @catppuccin_window_current_right_separator
  run '~/.tmux/plugins/tmux/catppuccin.tmux'
  refresh-client -S
}
set-hook -g client-light-theme {
  set -g @catppuccin_flavor "latte"
  set -g @catppuccin_reset "true"
  set-environment -g COLORFGBG "0;15"
  run '~/.tmux/plugins/tmux/catppuccin.tmux'
  set -g @catppuccin_window_status_style "rounded"
  set -g @catppuccin_window_text " #{?#{m/r:^(bash|zsh|fish|sh)$,#{pane_current_command}},#{?#{==:#{pane_current_path},#{@dotfiles_home}},~,#{b:pane_current_path}},#{pane_current_command} · #{=/15/…:pane_title}}"
  set -g @catppuccin_window_current_text " #{?#{m/r:^(bash|zsh|fish|sh)$,#{pane_current_command}},#{?#{==:#{pane_current_path},#{@dotfiles_home}},~,#{b:pane_current_path}},#{pane_current_command} · #{=/15/…:pane_title}}"
  set -g @catppuccin_status_background "#{@thm_bg}"
  set -g @catppuccin_status_session_icon_fg "#{@thm_crust}"
  set -g @catppuccin_status_session_text_fg "#{@thm_fg}"
  set -g @catppuccin_status_session_text_bg "#{@thm_surface_0}"
  set -g @catppuccin_window_current_text_color "#{@thm_overlay_0}"
  set -gu @catppuccin_window_current_left_separator
  set -gu @catppuccin_window_current_middle_separator
  set -gu @catppuccin_window_current_right_separator
  run '~/.tmux/plugins/tmux/catppuccin.tmux'
  refresh-client -S
}
%endif

# Expand status-left display width to avoid session name truncation
set -g status-left-length 40
set -g status-right-length 100
# Refresh status bar every 5 seconds
set -g status-interval 5

# Two status lines: line 0 is the window list only (full width, so it
# has room to breathe); line 1 holds session, resources, and time.
set -g status 2
set -g status-left ""
set -g status-right ""
set -g status-format[1] '#[align=left]#{E:@catppuccin_status_session} #[align=right]\
#[fg=#{E:@thm_bg},bg=#{E:@thm_blue},reverse]#[none]\
#[fg=#{E:@thm_crust},bg=#{E:@thm_blue}] 󰻠 \
#[fg=#{E:@thm_blue},bg=#{E:@thm_surface_0},reverse]#[none]\
#[fg=#{E:@thm_blue},bg=#{E:@thm_surface_0}] #(~/.tmux/scripts/cpu.sh) \
#[fg=#{E:@thm_surface_0},bg=#{E:@thm_green},reverse]#[none]\
#[fg=#{E:@thm_crust},bg=#{E:@thm_green}] 󰍛 \
#[fg=#{E:@thm_green},bg=#{E:@thm_surface_0},reverse]#[none]\
#[fg=#{E:@thm_green},bg=#{E:@thm_surface_0}] #(~/.tmux/scripts/mem.sh) \
#[fg=#{E:@thm_surface_0},bg=#{E:@thm_peach},reverse]#[none]\
#[fg=#{E:@thm_crust},bg=#{E:@thm_peach}] 󰢮 \
#[fg=#{E:@thm_peach},bg=#{E:@thm_surface_0},reverse]#[none]\
#[fg=#{E:@thm_peach},bg=#{E:@thm_surface_0}] #(~/.tmux/scripts/gpu.sh) \
#[fg=#{E:@thm_surface_0},bg=#{E:@thm_sky},reverse]#[none]\
#[fg=#{E:@thm_crust},bg=#{E:@thm_sky}] 󰓅 \
#[fg=#{E:@thm_sky},bg=#{E:@thm_surface_0},reverse]#[none]\
#[fg=#{E:@thm_sky},bg=#{E:@thm_surface_0}] #(~/.tmux/scripts/netspeed.sh) \
#[fg=#{E:@thm_surface_0},bg=#{E:@thm_sapphire},reverse]#[none]\
#[fg=#{E:@thm_crust},bg=#{E:@thm_sapphire}] 󰃰 \
#[fg=#{E:@thm_sapphire},bg=#{E:@thm_surface_0},reverse]#[none]\
#[fg=#{E:@thm_sapphire},bg=#{E:@thm_surface_0}] #{E:@catppuccin_date_time_text} \
#[fg=#{E:@thm_surface_0},bg=#{E:@thm_bg}]#[none]\
#[fg=#{E:@thm_fg},bg=#{E:@thm_bg}]'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
