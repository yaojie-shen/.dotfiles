# Getting colors in tmux
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

set -g mouse on

# Enable more history
set -g history-limit 50000

# Set window and panel index to start at 1
set -g base-index 1
setw -g pane-base-index 1

# Close a window and the rest renumber to stay consecutive.
set -g renumber-windows on

# Enable activity monitoring to track window output
setw -g monitor-activity on
# Disable visual bell for activity
set -g visual-activity off

# Set pane selection indicator (prefix + q) to display for 5 seconds
set -g display-panes-time 5000

# Keep status messages (such as copy confirmations) visible for 5 seconds.
set -g display-time 5000

# Move between panes with Ctrl+b + h/j/k/l
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Swap the current pane with its neighbor using Ctrl+b + Shift+h/j/k/l
bind H swap-pane -s '{left-of}'
bind J swap-pane -s '{down-of}'
bind K swap-pane -s '{up-of}'
bind L swap-pane -s '{right-of}'

# Resize using arrow keys with dynamic step
bind Left command-prompt -p "Resize left by (default 40):" \
    "run 'n=%1; [ -z \"\$n\" ] && n=40; tmux resize-pane -L \$n'"
bind Right command-prompt -p "Resize right by (default 40):" \
    "run 'n=%1; [ -z \"\$n\" ] && n=40; tmux resize-pane -R \$n'"
bind Up command-prompt -p "Resize up by (default 10):" \
    "run 'n=%1; [ -z \"\$n\" ] && n=10; tmux resize-pane -U \$n'"
bind Down command-prompt -p "Resize down by (default 10):" \
    "run 'n=%1; [ -z \"\$n\" ] && n=10; tmux resize-pane -D \$n'"

# Use Ctrl+Shift+Left/Right to move the current window to left/right.
# More info: https://superuser.com/questions/343572/how-do-i-reorder-tmux-windows
bind-key -n C-S-Left swap-window -t -1\; select-window -t -1
bind-key -n C-S-Right swap-window -t +1\; select-window -t +1

# Rename the window; submit an empty name to go back to automatic naming.
bind-key , command-prompt -I "#W" { if-shell -F "#{==:%%,}" { setw automatic-rename on } { rename-window -- "%%" } }

# Keep tmux's native command history and completion, with a clearer prompt.
bind-key : command-prompt -T command -p " COMMAND ❯ "

# Default is too slow which is annoying during heavy-use of the nvim in tmux.
set-option -s escape-time 0

# TPM plugins. Install/update with prefix + I, after adding new ones here.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @plugin 'fcsonline/tmux-thumbs#0.8.0'

# Send plugin copies to the attached terminal's clipboard over SSH as well.
# set-buffer alone updates only tmux's buffer; -w also emits OSC 52 to the client.
set -g @thumbs-command 'tmux set-buffer -w -- "{}" && tmux display-message "Copied {}"'
set -g @thumbs-upcase-command 'tmux set-buffer -w -- "{}" && tmux paste-buffer && tmux display-message "Copied {}"'
set -g @thumbs-multi-command 'tmux set-buffer -w -- "{}" && tmux paste-buffer && tmux display-message "Multi copied {}"'

# TPM needs this before its entrypoint is loaded.
setenv -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"

# Named status ranges arrived in tmux 3.4. Older multi-line-status versions
# use the native right range: one click opens the general monitor fallback.
set -g @dotfiles_monitor_cpu 'range=right'
set -g @dotfiles_monitor_mem 'range=right'
set -g @dotfiles_monitor_gpu 'range=right'
set -g @dotfiles_monitor_net 'range=right'
%if "#{m:[0-2].*,#{version}}"
# Keep legacy ranges: older tmux also predates numeric format comparisons.
%else
%if "#{>=:#{version},3.4}"
set -g @dotfiles_monitor_cpu 'range=user|cpu'
set -g @dotfiles_monitor_mem 'range=user|mem'
set -g @dotfiles_monitor_gpu 'range=user|gpu'
set -g @dotfiles_monitor_net 'range=user|net'
%endif
%endif

# Dependency-free fallback. It keeps the same session and resource data as the
# themed status bar, but uses plain tmux styles and no color-block separators.
# Catppuccin replaces only this presentation when its entrypoint is available.
set-environment -gu COLORFGBG
set -g status 2
set -g status-style default
set -g status-justify left
set -g status-left ''
set -g status-right ''
set -g status-left-length 40
set -g status-right-length 100
set -g status-interval 5
# Let prompts replace the lower metrics line while keeping window tabs visible.
set -gq message-line 1
set -g window-status-separator ''
set -g window-status-format ' #I:#W '
set -g window-status-current-format '#[reverse] #I:#W #[default]'
set -g status-format[1] '#[default,align=left,range=left] SESSION #S #[norange]#[align=right]#[#{@dotfiles_monitor_cpu}] CPU #(~/.tmux/scripts/cpu.sh) | #[#{@dotfiles_monitor_mem}]MEM #(~/.tmux/scripts/mem.sh) | #[#{@dotfiles_monitor_gpu}]GPU #(~/.tmux/scripts/gpu.sh) | #[#{@dotfiles_monitor_net}]NET #(~/.tmux/scripts/netspeed.sh)#[norange] | %Y-%m-%d %H:%M '
set -g window-status-current-style default
# Fill the whole line so prompts do not visually mix with status text.
set -g message-style "fg=colour183,bg=colour238,fill=colour238,bold,align=left"
set -g message-command-style "fg=colour183,bg=colour238,fill=colour238,bold,align=left"
set -g mode-style default

%if "#{>=:#{version},3.4}"
set -g popup-style default
set -g popup-border-style default
%endif

%if "#{>=:#{version},3.6}"
set-hook -gu client-dark-theme
set-hook -gu client-light-theme
%endif

# Missing plugins and thumbs binaries are installed without blocking startup.
# On success, the installer reloads this file; offline startup keeps the fallback.
if-shell "test ! -x ~/.tmux/plugins/tpm/tpm || test ! -f ~/.tmux/plugins/tmux/catppuccin.tmux || test ! -x ~/.tmux/plugins/tmux-thumbs/target/release/thumbs || test ! -x ~/.tmux/plugins/tmux-thumbs/target/release/tmux-thumbs" \
  "run-shell -b 'bash ~/.tmux/scripts/install-plugins.sh >/dev/null 2>&1'"

# Install workmux in the background so a missing network never blocks tmux.
if-shell "test ! -x ~/.local/bin/workmux && test -x ~/.devbox/setup/workmux" \
  "run-shell -b '~/.devbox/setup/workmux >/dev/null 2>&1; true'"
if-shell "test -x ~/.local/bin/workmux" \
  "bind-key f display-popup -E -w 90% -h 80% '\"$HOME/.local/bin/workmux\" dashboard'"
if-shell "test -x ~/.local/bin/workmux" \
  "bind-key F run-shell '\"$HOME/.local/bin/workmux\" sidebar'"

# Load the enhanced UI only when its plugin is actually present.
if-shell "test -f ~/.tmux/plugins/tmux/catppuccin.tmux && test -f ~/.tmux/catppuccin.conf" \
  "source-file ~/.tmux/catppuccin.conf"

# Initialize TPM only when its entrypoint exists.
if-shell "test -x ~/.tmux/plugins/tpm/tpm" "run-shell '~/.tmux/plugins/tpm/tpm'"

# Avoid upstream's interactive installation menu while background setup runs.
bind-key Space if-shell "test -x ~/.tmux/plugins/tmux-thumbs/target/release/thumbs && test -x ~/.tmux/plugins/tmux-thumbs/target/release/tmux-thumbs" \
  "run-shell -b '~/.tmux/plugins/tmux-thumbs/tmux-thumbs.sh'" \
  "display-message 'tmux-thumbs is not ready; background setup log: ~/.cache/tmux/plugin-install.log'"

# The session module owns the left mouse range on the lower status line.
# Use the same session chooser as prefix + s; window-tab clicks stay unchanged.
bind-key -n MouseDown1StatusLeft choose-tree -Zs

# These keys only own explicitly marked metric ranges; tabs and session retain
# their native bindings. Run asynchronously so the per-session lock cannot
# block tmux's command queue when a user double-clicks.
bind-key -n MouseDown1StatusRight run-shell -b 'bash "$HOME/.tmux/scripts/monitor.sh" --open #{q:socket_path} #{q:session_id} all'
%if "#{m:[0-2].*,#{version}}"
# Native right range only.
%else
%if "#{>=:#{version},3.4}"
bind-key -n MouseDown1Status if-shell -F '#{m/r:^(cpu|mem|gpu|net)$,#{mouse_status_range}}' \
  'run-shell -b "bash \"$HOME/.tmux/scripts/monitor.sh\" --open #{q:socket_path} #{q:session_id} #{q:mouse_status_range}"' \
  'select-window -t ='
%endif
%endif

# Final defaults apply with or without TPM/Catppuccin, including fallback reloads.
# Keep outside the if-shell and after TPM's synchronous run-shell: the plugin
# rewrites alert styles, whose backgrounds otherwise fill rounded tab corners.
set -g window-status-activity-style default
set -g window-status-bell-style default

# TPM may source Catppuccin again, so apply the opaque prompt palette last.
if-shell "test -f ~/.tmux/plugins/tmux/catppuccin.tmux" {
  set -gF message-style "fg=#{@thm_mauve},bg=#{@thm_mantle},fill=#{@thm_mantle},bold,align=left"
  set -gF message-command-style "fg=#{@thm_mauve},bg=#{@thm_mantle},fill=#{@thm_mantle},bold,align=left"
}
