# Catppuccin is optional. tmux.conf sources this file only after confirming
# that the plugin entrypoint exists.
set -g @catppuccin_flavor "mocha"
set-environment -g COLORFGBG "15;0"
set -g @catppuccin_window_status_style "rounded"

# Shell panes show the directory name; programs show "command · <title>".
set -g @dotfiles_home "$HOME"
set -g @catppuccin_window_text " #{?#{m/r:^(bash|zsh|fish|sh)$,#{pane_current_command}},#{?#{==:#{pane_current_path},#{@dotfiles_home}},~,#{b:pane_current_path}},#{pane_current_command} · #{=/15/…:pane_title}}"
set -g @catppuccin_window_current_text " #{?#{m/r:^(bash|zsh|fish|sh)$,#{pane_current_command}},#{?#{==:#{pane_current_path},#{@dotfiles_home}},~,#{b:pane_current_path}},#{pane_current_command} · #{=/15/…:pane_title}}"
set -g @catppuccin_date_time_text "%m-%d %H:%M"
set -g @catppuccin_status_background "#{@thm_bg}"
set -g @catppuccin_status_session_icon_fg "#{@thm_crust}"
set -g @catppuccin_status_session_text_fg "#{@thm_fg}"
set -g @catppuccin_status_session_text_bg "#{@thm_surface_0}"
set -g @catppuccin_window_current_text_color "#{@thm_overlay_0}"

run '~/.tmux/plugins/tmux/catppuccin.tmux'

# tmux 3.6+ reports terminal theme changes. Older versions keep the dark
# defaults above; they do not poll or inspect the host operating system.
%if "#{>=:#{version},3.6}"
set-hook -g client-dark-theme {
  set -g @dotfiles_catppuccin_flavor "mocha"
  run-shell -b 'bash ~/.tmux/scripts/apply-catppuccin-theme.sh'
}
set-hook -g client-light-theme {
  set -g @dotfiles_catppuccin_flavor "latte"
  run-shell -b 'bash ~/.tmux/scripts/apply-catppuccin-theme.sh'
}
%endif

set -g status-left-length 40
set -g status-right-length 100
set -g status-interval 5

# Two status lines: windows on top; session, resources, and time below.
set -g status 2
set -g status-left ""
set -g status-right ""
set -g status-format[1] '#[align=left]#{E:@catppuccin_status_session} #[align=right]\
#[fg=#{E:@thm_bg},bg=#{E:@thm_blue},reverse]#[none]\
#[fg=#{E:@thm_crust},bg=#{E:@thm_blue}] 󰻠 \
#[fg=#{E:@thm_blue},bg=#{E:@thm_surface_0},reverse]#[none]\
#[fg=#{E:@thm_blue},bg=#{E:@thm_surface_0}] #(~/.tmux/scripts/cpu.sh) \
#[fg=#{E:@thm_surface_0},bg=#{E:@thm_green},reverse]#[none]\
#[fg=#{E:@thm_crust},bg=#{E:@thm_green}] 󰍛 \
#[fg=#{E:@thm_green},bg=#{E:@thm_surface_0},reverse]#[none]\
#[fg=#{E:@thm_green},bg=#{E:@thm_surface_0}] #(~/.tmux/scripts/mem.sh) \
#[fg=#{E:@thm_surface_0},bg=#{E:@thm_peach},reverse]#[none]\
#[fg=#{E:@thm_crust},bg=#{E:@thm_peach}] 󰢮 \
#[fg=#{E:@thm_peach},bg=#{E:@thm_surface_0},reverse]#[none]\
#[fg=#{E:@thm_peach},bg=#{E:@thm_surface_0}] #(~/.tmux/scripts/gpu.sh) \
#[fg=#{E:@thm_surface_0},bg=#{E:@thm_sky},reverse]#[none]\
#[fg=#{E:@thm_crust},bg=#{E:@thm_sky}] 󰓅 \
#[fg=#{E:@thm_sky},bg=#{E:@thm_surface_0},reverse]#[none]\
#[fg=#{E:@thm_sky},bg=#{E:@thm_surface_0}] #(~/.tmux/scripts/netspeed.sh) \
#[fg=#{E:@thm_surface_0},bg=#{E:@thm_sapphire},reverse]#[none]\
#[fg=#{E:@thm_crust},bg=#{E:@thm_sapphire}] 󰃰 \
#[fg=#{E:@thm_sapphire},bg=#{E:@thm_surface_0},reverse]#[none]\
#[fg=#{E:@thm_sapphire},bg=#{E:@thm_surface_0}] #{E:@catppuccin_date_time_text} \
#[fg=#{E:@thm_surface_0},bg=#{E:@thm_bg}]#[none]\
#[fg=#{E:@thm_fg},bg=#{E:@thm_bg}]'
