# Catppuccin is optional. tmux.conf sources this file only after confirming
# that the plugin entrypoint exists.
set -g @catppuccin_flavor "mocha"
set-environment -g COLORFGBG "15;0"
# Explicit colors keep rounded tabs compatible with a transparent background.
set -g @catppuccin_window_status_style 'custom'
set -g @catppuccin_window_left_separator '#[fg=#{E:@catppuccin_window_number_color},bg=##{?window_start_flag,default,#{E:@thm_surface_0}}]#[fg=#{E:@thm_crust},bg=#{E:@catppuccin_window_number_color}]'
set -g @catppuccin_window_middle_separator ' '
set -g @catppuccin_window_right_separator '#[fg=#{E:@thm_surface_0},bg=##{?window_end_flag,default,#{E:@thm_surface_0}}]##{?window_end_flag,, }#[default]'
set -g @catppuccin_window_current_left_separator '#[fg=#{E:@catppuccin_window_current_number_color},bg=##{?window_start_flag,default,#{E:@thm_surface_0}}]#[fg=#{E:@thm_crust},bg=#{E:@catppuccin_window_current_number_color}]'
set -g @catppuccin_window_current_middle_separator ' '
set -g @catppuccin_window_current_right_separator '#[fg=#{E:@thm_surface_0},bg=##{?window_end_flag,default,#{E:@thm_surface_0}}]##{?window_end_flag,, }#[default]'

# Shell panes show the directory name; agent panes show only the shared bot
# icon and session title; other programs show "command · <title>".
set -g @dotfiles_home "$HOME"
set -g @catppuccin_window_text " #{?automatic-rename,#{?#{m/ri:^(claude|codex|gemini|opencode|copilot|github-copilot|agy|kiro-cli|vibe|pi|omp|grok)$,#{pane_current_command}},󰚩 #{=/48/…:pane_title},#{?#{m/r:^(bash|zsh|fish|sh)$,#{pane_current_command}},󰉋 #{?#{==:#{pane_current_path},#{@dotfiles_home}},~,#{b:pane_current_path}},#{pane_current_command} · #{=/15/…:pane_title}}},#W}"
set -g @catppuccin_window_current_text " #[bold,fg=#{E:@thm_mauve}]#{?automatic-rename,#{?#{m/ri:^(claude|codex|gemini|opencode|copilot|github-copilot|agy|kiro-cli|vibe|pi|omp|grok)$,#{pane_current_command}},󰚩 #{=/48/…:pane_title},#{?#{m/r:^(bash|zsh|fish|sh)$,#{pane_current_command}},󰉋 #{?#{==:#{pane_current_path},#{@dotfiles_home}},~,#{b:pane_current_path}},#{pane_current_command} · #{=/15/…:pane_title}}},#W}#[nobold]"
set -g @catppuccin_date_time_text "%m-%d %H:%M"
# Use the terminal background so iTerm transparency carries through.
set -g @catppuccin_status_background "none"
set -g @catppuccin_status_session_icon_fg "#{@thm_crust}"
set -g @catppuccin_status_session_text_fg "#{@thm_fg}"
set -g @catppuccin_status_session_text_bg "#{@thm_surface_0}"
set -g @catppuccin_window_current_text_color "#{@thm_surface_0}"

run '~/.tmux/plugins/tmux/catppuccin.tmux'

# Join window tabs into one continuous segmented strip.
set -g window-status-separator ''

# Alert backgrounds otherwise fill the transparent corners of rounded tabs.
set -g window-status-activity-style default
set -g window-status-bell-style default

# tmux 3.6+ reports terminal theme changes. Older versions keep the dark
# defaults above; they do not poll or inspect the host operating system.
%if "#{>=:#{version},3.6}"
set-hook -g client-dark-theme {
  set -g @dotfiles_catppuccin_flavor "mocha"
  run-shell -b 'bash ~/.tmux/scripts/apply-catppuccin-theme.sh'
}
set-hook -g client-light-theme {
  set -g @dotfiles_catppuccin_flavor "latte"
  run-shell -b 'bash ~/.tmux/scripts/apply-catppuccin-theme.sh'
}
%endif

set -g status-left-length 40
set -g status-right-length 100
set -g status-interval 5

# Two status lines: windows on top; session, resources, and time below.
# metrics.sh publishes the values into the @dotfiles_* options read here; the
# job itself prints nothing. It goes first because a job spends the format's
# expansion budget, and once that runs out the rest of the line is skipped
# without being evaluated - a job at the end would simply stop running.
set -g status 2
set -g status-left ""
set -g status-right ""
set -g status-format[1] '#(~/.tmux/scripts/metrics.sh)#[align=left,range=left]#{E:@catppuccin_status_session}#[norange] #[align=right]\
#[#{@dotfiles_monitor_cpu}]#[fg=#{E:@thm_blue},bg=default]#[none]\
#[fg=#{E:@thm_crust},bg=#{E:@thm_blue}] 󰻠 \
#[fg=#{E:@thm_blue},bg=#{E:@thm_surface_0},reverse]#[none]\
#[fg=#{E:@thm_blue},bg=#{E:@thm_surface_0}] #{E:@dotfiles_cpu} \
#[#{@dotfiles_monitor_mem}]#[fg=#{E:@thm_surface_0},bg=#{E:@thm_green},reverse]#[none]\
#[fg=#{E:@thm_crust},bg=#{E:@thm_green}] 󰍛 \
#[fg=#{E:@thm_green},bg=#{E:@thm_surface_0},reverse]#[none]\
#[fg=#{E:@thm_green},bg=#{E:@thm_surface_0}] #{E:@dotfiles_mem} \
#[#{@dotfiles_monitor_gpu}]#[fg=#{E:@thm_surface_0},bg=#{E:@thm_peach},reverse]#[none]\
#[fg=#{E:@thm_crust},bg=#{E:@thm_peach}] 󰢮 \
#[fg=#{E:@thm_peach},bg=#{E:@thm_surface_0},reverse]#[none]\
#[fg=#{E:@thm_peach},bg=#{E:@thm_surface_0}] #{E:@dotfiles_gpu} \
#[#{@dotfiles_monitor_net}]#[fg=#{E:@thm_surface_0},bg=#{E:@thm_sky},reverse]#[none]\
#[fg=#{E:@thm_crust},bg=#{E:@thm_sky}] 󰓅 \
#[fg=#{E:@thm_sky},bg=#{E:@thm_surface_0},reverse]#[none]\
#[fg=#{E:@thm_sky},bg=#{E:@thm_surface_0}] #{E:@dotfiles_net} \
#[norange]#[fg=#{E:@thm_surface_0},bg=#{E:@thm_sapphire},reverse]#[none]\
#[fg=#{E:@thm_crust},bg=#{E:@thm_sapphire}] 󰃰 \
#[fg=#{E:@thm_sapphire},bg=#{E:@thm_surface_0},reverse]#[none]\
#[fg=#{E:@thm_sapphire},bg=#{E:@thm_surface_0}] #{E:@catppuccin_date_time_text} \
#[fg=#{E:@thm_surface_0},bg=default]#[none]\
#[fg=#{E:@thm_fg},bg=default]'
