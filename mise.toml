min_version = "2026.10.15"

[vars]
dotfiles_root = "{{config_source | canonicalize | dirname}}"

[env]
DOTFILES_ROOT = "{{vars.dotfiles_root}}"
HYDRA_FULL_ERROR = "1"
HF_HOME = "{{vars.dotfiles_root}}/persistent/cache/huggingface"
OLLAMA_MODELS = "{{vars.dotfiles_root}}/persistent/cache/ollama"
PIP_CACHE_DIR = "{{vars.dotfiles_root}}/persistent/cache/pip"
UV_CACHE_DIR = "{{vars.dotfiles_root}}/persistent/cache/uv"
SKILLS_HOME = "{{vars.dotfiles_root}}/persistent/skills"
_.path = ["{{vars.dotfiles_root}}/bin", "{{system_brew_prefix}}/bin", "{{system_brew_prefix}}/sbin"]

[settings]
# Status/configuration tasks must not install the entire toolbox as a side effect.
task.run_auto_install = false

# Mise owns versions, downloads, verification, PATH and shims for portable tools.
# Install this layer with `mise install`; change versions with `mise use -g`.
[tools]
node = "lts"
python = "3.13"
"aqua:ajeetdsouza/zoxide" = "latest"
"aqua:tmux/tmux-builds" = "3.7c"
"aqua:starship/starship" = "latest"
"aqua:astral-sh/uv" = "latest"
"aqua:jesseduffield/lazygit" = "latest"
"aqua:neovim/neovim" = "latest"
"aqua:PaulJuliusMartinez/jless" = { version = "0.9.0", os = ["linux/x64", "macos"] }
"github:YS-L/csvlens" = "0.15.1"
"github:raine/workmux" = "latest"

[tools."github:dundee/gdu"]
version = "5.38.0"
rename_exe = "gdu"
# The static Linux builds avoid a dependency on the host's glibc version.
[tools."github:dundee/gdu".platforms]
linux-x64 = { asset_pattern = "gdu_linux_amd64_static.tgz" }
linux-arm64 = { asset_pattern = "gdu_linux_arm64.tgz" }
macos-x64 = { asset_pattern = "gdu_darwin_amd64.tgz" }
macos-arm64 = { asset_pattern = "gdu_darwin_arm64.tgz" }

# Upstream publishes thumbs binaries for x86_64; mise builds the same version
# with its cargo backend on ARM, including installing the Rust toolchain.
[tools."github:fcsonline/tmux-thumbs"]
version = "0.8.0"
os = ["linux/x64", "macos/x64"]
[tools."github:fcsonline/tmux-thumbs".platforms]
linux-x64 = { asset_pattern = "tmux-thumbs_0.8.0_x86_64-unknown-linux-musl.tar.gz" }
macos-x64 = { asset_pattern = "tmux-thumbs_0.8.0_x86_64-apple-darwin.zip" }

[tools.rust]
version = "stable"
os = ["linux/arm64", "macos/arm64"]

[tools."cargo:fcsonline/tmux-thumbs"]
version = "tag:0.8.0"
locked = true
os = ["linux/arm64", "macos/arm64"]

[bootstrap.repos]
"~/.local/share/dotfiles/zsh-autosuggestions" = { url = "https://github.com/zsh-users/zsh-autosuggestions.git", depth = 1 }
"~/.local/share/dotfiles/fast-syntax-highlighting" = { url = "https://github.com/zdharma-continuum/fast-syntax-highlighting.git", depth = 1 }
"~/.local/share/dotfiles/powerlevel10k" = { url = "https://github.com/romkatv/powerlevel10k.git", depth = 1 }
"~/.tmux/plugins/tmux" = { url = "https://github.com/catppuccin/tmux.git", ref = "v2.1.3", depth = 1 }
"~/.tmux/plugins/tmux-thumbs" = { url = "https://github.com/fcsonline/tmux-thumbs.git", ref = "0.8.0", depth = 1 }

[bootstrap.hooks]
pre-dotfiles = 'bash "{{vars.dotfiles_root}}/mise/scripts/prepare"'

[dotfiles]
"~/.bashrc" = "bashrc"
"~/.zshrc" = "zshrc"
"~/.condarc" = "condarc"
"~/.tmux.conf" = "tmux.conf"
"~/.tmux/catppuccin.conf" = "tmux/catppuccin.conf"
"~/.tmux/scripts" = "tmux/scripts"
"~/.config/workmux/config.yaml" = "config/workmux/config.yaml"
"~/.config/uv/uv.toml" = "config/uv/uv.toml"
"~/.shell" = "shell"
"~/.config/nvim" = "nvim"
"~/.config/fish/config.fish" = "config.fish"
"~/.config/starship.toml" = "starship.toml"

# Optional applications are selected with -E apps, or declared in the private repo.
# File tasks contain host operations, never tool download/version-manager code.
[tasks.dotfiles]
description = "Apply configuration links and preserve existing mutable data"
run = '"{{mise_bin}}" -C "$HOME" dot apply --yes'

[tasks.status]
description = "Inspect managed tools and dotfiles"
run = ['"{{mise_bin}}" -C "$HOME" ls', '"{{mise_bin}}" -C "$HOME" dot status']

[tasks.update]
description = "Fast-forward public and registered private repos, then bootstrap"
file = "{{vars.dotfiles_root}}/mise/operations/update"

[tasks."system:packages"]
description = "Install optional OS packages using the host package manager"
run = '"{{mise_bin}}" -C "$HOME" -E system bootstrap --only packages --yes'

[tasks."shell:fallback"]
description = "Choose the interactive shell used when the login shell is Bash"
file = "{{vars.dotfiles_root}}/mise/operations/shell-fallback"

[tasks."ssh:authorize"]
description = "Authorize a public SSH key idempotently"
file = "{{vars.dotfiles_root}}/mise/operations/ssh-authorize"

[tasks."ssh:serve"]
description = "Start a user SSH server on an unprivileged port"
file = "{{vars.dotfiles_root}}/mise/operations/ssh-serve"

[tasks."skills:init"]
description = "Initialize an empty Skills Library (requires the apps profile)"
file = "{{vars.dotfiles_root}}/mise/operations/skills-init"

[tasks."vscode:login"]
description = "Authenticate VS Code tunnels (requires the apps profile)"
run = "code tunnel user login"

[tasks."vscode:serve"]
description = "Run a VS Code tunnel in the foreground (requires the apps profile)"
run = "code tunnel"

[tasks."workmux:configure"]
description = "Configure workmux agent hooks"
run = "workmux setup"
